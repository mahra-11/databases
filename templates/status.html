{% extends "base.html" %}
{% from "_macros.html" import flight_table %}
{% block content %}
<h1>Flight status</h1>
<div class="card">
  <form class="inline" method="get" action="{{ url_for('public.status') }}">
    <label>Flight number<input name="flight_num" value="{{ args.get('flight_num', '') }}" required></label>
    <label>Airline (optional)<input name="airline" value="{{ args.get('airline', '') }}"></label>
    <label>Date (optional)<input type="date" name="date" value="{{ args.get('date', '') }}"></label>
    <label>Date is the
      <select name="date_type">
        <option value="departure" {% if args.get('date_type') != 'arrival' %}selected{% endif %}>departure date</option>
        <option value="arrival" {% if args.get('date_type') == 'arrival' %}selected{% endif %}>arrival date</option>
      </select>
    </label>
    <button type="submit">Check status</button>
  </form>
</div>
{% if flights is not none %}{{ flight_table(flights) }}{% endif %}
{% endblock %}
