{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<div class="card">
  <form class="stack" method="post" action="{{ url_for('auth.login') }}">
    <label>I am a
      <select name="user_type">
        <option value="customer" {% if form.get('user_type') == 'customer' %}selected{% endif %}>Customer</option>
        <option value="agent" {% if form.get('user_type') == 'agent' %}selected{% endif %}>Booking agent</option>
        <option value="staff" {% if form.get('user_type') == 'staff' %}selected{% endif %}>Airline staff</option>
      </select>
    </label>
    <label>Email (staff: username)<input name="username" value="{{ form.get('username', '') }}" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('auth.register') }}">Register</a>.</p>
</div>
{% endblock %}
